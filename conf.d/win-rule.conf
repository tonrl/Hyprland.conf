#============================#
#   WINDOWS AND WORKSPACES   #
#============================#

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule = suppress_event maximize, match:class .* # You'll probably like this.

# Setting for full screen
windowrule = border_color rgb(5A6446), match:fullscreen true
# windowrule = opaque, fullscreen:1


#============================#
# Set rule based on tags     #
#============================#

#==========================================#
source = win-rule.conf.d/win-general.conf
source = win-rule.conf.d/win-floating.conf
source = win-rule.conf.d/win-opaque.conf
source = win-rule.conf.d/win-no-screen.conf 
source = win-rule.conf.d/win-shimeji.conf
#==========================================#

# Enable or disable group by default
windowrule = group set, match:tag term
windowrule = group set, match:tag email
windowrule = group barred, match:tag noGroup

# Opaque
windowrule = opaque on, match:tag Opaque
windowrule = opacity 0.9, match:tag term

windowrule = animation gnomed, match:tag term
# Open at specified workspace
windowrule = workspace 4, match:tag finance
windowrule = workspace 3, match:tag code

# Open at special workspace
windowrule = workspace special:magic, match:tag email

# No scren share
windowrule = no_screen_share on, match:tag noScreen

#============================#
# Rule for floating window   #
#============================#


# Float
windowrule = float on, match:tag Float
# Floating size

windowrule = max_size 750 650, match:tag FSize, match:float true
windowrule = center on, match:tag FSize, match:float true


