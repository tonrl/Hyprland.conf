#===========================#
# Flating Window Rule       #
#===========================#

# Set floating size for kitty when it is float

# windowrule = tag +FSize, match:class foot
# windowrule = tag +FSize, match:class footclient,floating:1
windowrule = max_size 750 650, match:class foot, match:float true
windowrule = max_size 750 650, match:class footclient,match:float true
windowrule = center on, match:class ^(kitty)$, match:float true
windowrule = center on, match:class ^(foot)$, match:float true

# XDG popup etc for saving, uploading files
windowrule = tag +Float, match:tag FILE_OP
windowrule = move 462 231, match:tag FILE_OP
windowrule = size 787 600, match:tag FILE_OP

windowrule = tag +Float, match:title (), match:tag WebBrowser
windowrule = tag +Float, match:title (Library), match:tag WebBrowser
windowrule = size 660 500, match:title (Library), match:tag WebBrowser
windowrule = size 587 400, match:title (Opening)(.*)$, match:tag WebBrowser
# XDG desktop portal popup
# windowrule = size 787 600, match:title (), tag:WebBrowser

# Default rule for floating window
windowrule = float on, match:tag ft_mit
windowrule = size 650 450, match:tag ft_mit
windowrule = move 601 183, match:tag ft_mit
#mid
windowrule = float on, match:tag ft_mit_mid
windowrule = size 750 550, match:tag ft_mit_mid
windowrule = move 601 183, match:tag ft_mit_mid
# large
windowrule = float on, match:tag ft_mit_lg
windowrule = size 750 650, match:tag ft_mit_lg
windowrule = move 601 183, match:tag ft_mit_lg

#============================#
# Floating Window Auto       #
#============================#
# hyprland share picker
windowrule = tag +ft_mit, match:class (hyprland-share-picker)
# nm-applet
windowrule = tag +ft_mit_lg, match:tag NetWork
windowrule = pin on, match:tag NetWork
windowrule = opaque on, match:tag NetWork

# KeePassXC
windowrule = float on, match:tag KEEPASSXC
windowrule = size 800 650, match:tag KEEPASSXC
windowrule = move 601 183, match:tag KEEPASSXC

windowrule = tag +KEEPASSXC, match:title (passdef - KeePassXC)
windowrule = tag +KEEPASSXC, match:title (.*)(- KeePassXC)

windowrule = pin on, match:class (org.keepassxc.KeePassXC)
windowrule = opaque on, match:class (org.keepassxc.KeePassXC)

# Audio Controller (easy easyeffects, pwvucontrol, overskyride)
windowrule = tag +ft_mit_mid, match:tag Audio_ctl
windowrule = pin on, match:tag Audio_ctl

# Show Me the Key
windowrule = float on, match:class (showmethekey-gtk)
windowrule = size 669 68, match:class (showmethekey-gtk)
windowrule = move 42 1067, match:class (showmethekey-gtk)
windowrule = pin on, match:class (showmethekey-gtk)
windowrule = opaque on, match:class (showmethekey-gtk)

windowrule = float on, match:class (org.twosheds.iwgtk)
windowrule = move 1442 57, match:class (org.twosheds.iwgtk)

# firewall applet
windowrule = float on, match:title (firewall-applet)
# windowrule = move 1600 57, match:title (firewall-applet)
windowrule = float on, match:title (About Firewall Applet)

# Gnome Calculator
windowrule = float on, match:class (org.gnome.Calculator)
windowrule = size 360 616, match:class (org.gnome.Calculator)
windowrule = move 789 209, match:class (org.gnome.Calculator)

# idleinhibit

windowrule = idle_inhibit focus, match:title ^(YouTube)$

# Gimp
windowrule = opaque on, match:initial_title (GNU Image Manipulation Program)

# Hyprland dialog
windowrule = move 491 92, match:class  hyprland-dialog

# Yubikey
windowrule = float on, match:tag Yubico
windowrule = size 750 700, match:tag Yubico
windowrule = move 580 209, match:tag Yubico
windowrule = pin on, match:tag Yubico

# ANIMATION
windowrule = animation slide, match:class (org.keepassxc.KeePassXC)
windowrule = animation slide, match:class  hyprland-dialog

# ueberzugpp
# windowrule = animation popin 80%, match:class ueberzugpp(.*)
# windowrule = noanim, match:class ueberzugpp(.*)

# Image viwer
windowrule = tile on, match:title qiv:(.*)


