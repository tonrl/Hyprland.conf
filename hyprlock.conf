# Hyprlock config

$font = JetBrainsMono Nerd Semi Bold


general {
        hide_cursor = false
        fail_timeout = 4000

}

animations {
        enabled = true
        bezier = linear, 1, 1, 0, 0
        animation = fadeIn, 1, 3, linear
        animation = fadeOut, 1, 3, linear
        animation = inputFieldDots, 1, 2, linear
}

background {
        monitor =
        # path =   $HOME/Pictures/wallpaper/sway/tux_penguin.jpg   # only png supported for now
        path =   $HOME/Pictures/wallpaper/lfs/lfs_ch.png  # only png supported for now
        blur_passes = 2
        brightness = 0.2
        contrast = 1
        vibrancy = 0.17
        vibrancy_darkness =  1
}


# Input field

input-field {
        monitor =
        size = 200, 45
        outline_thickness = 3
        dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
        # dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
        dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
        dots_center = true
        dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
        outer_color = rgb(453c3c)
        inner_color = rgb(141414)
        font_color = rgb(180,180,180)
        fade_on_empty = false
        fade_timeout = 500 # Milliseconds before fade_on_empty is triggered.
        placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
        hide_input = false
        rounding = -1 # -1 means complete rounding (circle/oval)
        check_color = rgb(120,215,109)
        fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
        fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
        fail_transition = 300 # transition time in ms between normal outer_color and fail_color
        capslock_color = -1
        numlock_color = -1
        bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
        invert_numlock = false # change color if numlock is off
        swap_font_color = false # see below
        position = 0, -320
        halign = center
        valign = center
}

# Hour-Time
label {
        monitor =
        text = cmd[update:1000] echo -e "$(date +"%H")"
        color = rgba(177,14,251, 0.8)
        font_family = $font
        font_size = 180
        position = 0, 150
        halign = center
        valign = center
        shadow_passes = 5
        shadow_size = 10
}

# Minute-Time
label {
        monitor =
        text = cmd[update:1000] echo -e "$(date +"%M")"
        color = rgba(200, 200, 200, 0.8)
        font_family = $font
        font_size = 180
        position = 0, -75
        halign = center
        valign = center
}

# Date
label {
        monitor =
        text = cmd[update:1000] echo -e "$(LC_TIME="de_DE.UTF-8" date +"%A %d. %b (%S s)")"
        color = rgba(200, 200, 200, 1.0)
        font_size = 15
        font_family = $font
        position = 100, -100
        halign = left
        valign = top
}


# Date
label {
        monitor =
        text = cmd[update:1000] bash hyprlock-effect.sh
        color = rgba(200, 200, 200, 1.0)
        font_family = $font
        font_size = 15
#       position = 0, 5
#       halign = center
#       valign = center
        position = 100, -130
        halign = left
        valign = top
}

